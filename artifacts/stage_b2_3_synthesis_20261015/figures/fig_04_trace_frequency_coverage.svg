   <text style="fill: #28333f; font: 700 18px 'Microsoft YaHei'; text-anchor: start" x="65.34" y="31.66875" transform="rotate(-0 65.34 31.66875)">常见表达覆盖很多题；极高重复次数主要来自少数关系句循环</text>
  </g>
  <g id="text_45">
   <text style="fill: #596774; font: 10.8px 'Microsoft YaHei'; text-anchor: start" x="65.34" y="51.84" transform="rotate(-0 65.34 51.84)">100题各取一条32K上限的可见思考文本；统计不包含题干和正式答案</text>
  </g>
  <g id="text_46">
   <text style="fill: #28333f; font: 10.5px 'Microsoft YaHei'; text-anchor: start" x="65.34" y="369.36" transform="rotate(-0 65.34 369.36)">左、中：覆盖率可避免长文本主导总词频。右：每句均只覆盖1题（1%），却可在该题中重复上千次。</text>
  </g>
  <g id="text_47">
   <text style="fill: #65717d; font: 10px 'Microsoft YaHei'; text-anchor: start" x="65.34" y="393.12" transform="rotate(-0 65.34 393.12)">wait / maybe / let me try 是可见文本行为标记，不能直接证明模型完成了检查或有效纠错。</text>
  </g>
  <g id="text_48">
   <text style="fill: #65717d; font: 9.6px 'Microsoft YaHei'; text-anchor: start" x="65.34" y="412.56" transform="rotate(-0 65.34 412.56)">字面短语按预定义规则匹配，类别不互斥；“unit steps”仅4%不代表仅4题理解了单位步长；clock也匹配o’clock中的clock。</text>
  </g>
 </g>
