   <text style="fill: #28333f; font: 700 17px 'Microsoft YaHei'; text-anchor: start" x="62.712" y="32.021375" transform="rotate(-0 62.712 32.021375)">4条长循环轨迹集中了77.3%的重复词，32K新增计算未带来答案</text>
