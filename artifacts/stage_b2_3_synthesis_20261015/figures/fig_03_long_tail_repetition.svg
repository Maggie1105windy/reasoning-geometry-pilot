  <g id="text_36">
   <text style="fill: #65717d; font: 9.8px 'Microsoft YaHei'; text-anchor: start" x="62.712" y="421.632" transform="rotate(-0 62.712 421.632)">重复词口径：规范化后，同一句保留首次，其后出现次数×句子词数；这不是“无效推理率”。</text>
